# Pruned Bitcoin testnet4 node for the tl_observe dress rehearsal.
# RPC is loopback-only with cookie auth; the observer reads the cookie file.
testnet4=1
server=1
disablewallet=1
prune=2000
dbcache=150
maxmempool=50
blocksonly=1
listen=0
maxconnections=10

[testnet4]
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcport=48332
