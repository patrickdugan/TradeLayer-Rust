          grep -Fxq 'receipts=26' "$tmp_dir/report"

  # The release build is independent of source-format/semantic tests and
  # consumes ~42s in the prior serial 84s workflow. Run it on another
  # isolated frozen runner; NEVER replace it with a debug build.
  release:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Enforce zero external Rust crates and frozen toolchain
        run: python3 scripts/check_rust_supply_chain.py
      - name: Release build without network or lockfile changes
        run: cargo build --all-targets --release --frozen
      - name: Release synthetic 8000-TX CPU preindex throughput measurement (no speedup gate)
        run: |
          target/release/tradelayer-index-bench 8000 512 4 512 3 > /tmp/txindex-release-perf.log
          cat /tmp/txindex-release-perf.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-release-perf.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-release-perf.log
      - name: Mixed 50-percent-SegWit 6000-TX release parallel benchmark (no speedup gate)
        run: |
          target/release/tradelayer-index-bench 6000 384 4 512 3 50 > /tmp/txindex-segwit-perf.log
          cat /tmp/txindex-segwit-perf.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-segwit-perf.log
          grep -Fxq 'segwit_percent=50' /tmp/txindex-segwit-perf.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-segwit-perf.log
      - name: Stage 8C release 4000-TX one-fetch zero-copy versus owned-Vec benchmark
        run: |
          target/release/tradelayer-block-ingest-bench 4000 4 50 3 > /tmp/txindex-bulk-perf.log
          cat /tmp/txindex-bulk-perf.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-bulk-perf.log
          grep -Fxq 'new_raw_tx_byte_copies=0' /tmp/txindex-bulk-perf.log
          grep -Fxq 'bulk_mock_rpc_calls_per_iteration=1' /tmp/txindex-bulk-perf.log
          grep -Fxq 'txid_merkle=LOCAL_CHECK_ONLY' /tmp/txindex-bulk-perf.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-bulk-perf.log
      - name: Stage 8D fused benchmark at 1000 TX single worker, 0 percent SegWit
        run: |
          target/release/tradelayer-block-ingest-bench 1000 1 0 2 > /tmp/txindex-8d-small.log
          cat /tmp/txindex-8d-small.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-8d-small.log
          grep -q '^full_owned_block_pipeline_median_ms=' /tmp/txindex-8d-small.log
          grep -q '^fused_prepared_only_median_ms=' /tmp/txindex-8d-small.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-8d-small.log
      - name: Stage 8D fused benchmark at 10000 TX eight workers, 95 percent SegWit
        run: |
          target/release/tradelayer-block-ingest-bench 10000 8 95 2 > /tmp/txindex-8d-large.log
          cat /tmp/txindex-8d-large.log
          grep -Fxq 'ordered_equivalence=PASS' /tmp/txindex-8d-large.log
          grep -q '^full_pipeline_speed_ratio=' /tmp/txindex-8d-large.log
          grep -Fxq 'full_block_consensus=UNVERIFIED' /tmp/txindex-8d-large.log
          grep -q '^one_team_prepared_only_median_ms=' /tmp/txindex-8d-large.log
          grep -q '^one_team_vs_windowed_ratio=' /tmp/txindex-8d-large.log
          grep -Fxq 'one_team_extra_result_slots=10000' /tmp/txindex-8d-large.log

  # Preserve the preexisting required "check" job name, but make it an
  # explicit AND over both independent jobs. A test or release failure,
  # cancellation, skipped check or superseded run MUST block promotion.
  check:
    needs: [tests, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce full frozen tests AND release build success
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          test "$TESTS_RESULT" = success
          test "$RELEASE_RESULT" = success
