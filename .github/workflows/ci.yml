name: Rust CI

on:
  # A PR is the feature-branch CI gate, so a push to that branch should not
  # enqueue another full copy of the same workflow and email twice on failure.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch commits so only the newest proposal consumes CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24 source-oracle host
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Enforce zero external Rust crates and frozen toolchain
        run: python3 scripts/check_rust_supply_chain.py
      - name: Dependency gate adversarial mutation tests
        run: python3 -m unittest discover -s tests -p test_rust_supply_chain.py -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check included snapshot file formatting
        run: rustfmt --check --edition 2021 src/registry_snapshot_impl.rs src/execution_snapshot_impl.rs src/execution_channel_revisions_impl.rs src/ledger_channels_impl.rs src/ledger_settlement_impl.rs src/ledger_channel_revisions_impl.rs
      - name: Check included bounded RPC parser formatting
        run: rustfmt --check --edition 2021 src/rpc_json_impl.rs src/rpc_http_impl.rs
      - name: Check included exact trade-history formatting
        run: rustfmt --check --edition 2021 src/trade_history_position_impl.rs
      - name: Check included VolumeIndex source metadata formatting
        run: rustfmt --check --edition 2021 src/volume_index_source_impl.rs src/source_contract_accounting_impl.rs src/source_contract_aux_impl.rs src/source_contract_fee_impl.rs src/source_contract_oracle_impl.rs
      - name: Check included spot snapshot file formatting
        run: rustfmt --check --edition 2021 src/spot_snapshot_impl.rs src/ledger_native_impl.rs src/spot_native_impl.rs src/joint_native_impl.rs src/joint_chain_native_impl.rs src/economic_native_impl.rs src/economic_insurance_impl.rs src/economic_insurance_snapshot_impl.rs
      - name: Check included joint snapshot file formatting
        run: rustfmt --check --edition 2021 src/joint_snapshot_impl.rs src/joint_economic_impl.rs src/economic_snapshot_impl.rs src/economic_funding_impl.rs src/economic_mark_impl.rs src/economic_liquidation_impl.rs src/economic_liquidation_replay_impl.rs src/contract_orderbook_liquidation_impl.rs src/economic_amm_impl.rs src/economic_amm_replay_impl.rs src/economic_contract_impl.rs src/economic_block_stage_impl.rs src/economic_consensus_impl.rs src/economic_source_catalog_impl.rs src/economic_source_catalog_snapshot_impl.rs src/economic_source_send_impl.rs src/economic_source_oracle_impl.rs
      - name: Check included combined clearing snapshot formatting
        run: rustfmt --check --edition 2021 src/clearing_snapshot_impl.rs
      - name: Check included IOU checkpoint formatting
        run: rustfmt --check --edition 2021 src/iou_snapshot_impl.rs src/iou_ledger_snapshot_impl.rs
      - name: Check included research distressed closeout formatting
        run: rustfmt --check --edition 2021 src/clearing_distress_impl.rs
      - name: Check included synthetic bilateral partial reduction formatting
        run: rustfmt --check --edition 2021 src/clearing_partial_impl.rs
      - name: Check included literal global settlement formatting
        run: rustfmt --check --edition 2021 src/source_clearing_funding_impl.rs src/source_insurance_lifecycle_impl.rs src/source_insurance_legacy_v1_impl.rs src/source_iou_settlement_impl.rs src/source_clearing_liquidation_impl.rs src/source_clearing_expiry_impl.rs src/source_clearing_global_impl.rs src/source_clearing_mark_settlement_impl.rs src/source_clearing_supply_impl.rs src/source_contract_history_schedule_impl.rs src/source_contract_registry_lifecycle_impl.rs src/source_channel_financial_impl.rs src/contract_channel_queue_source_impl.rs src/source_channel_logic_impl.rs src/source_transition_witness_impl.rs src/source_contract_position_identity_impl.rs src/source_channel_volume_impl.rs src/source_option_trade_impl.rs src/source_synthetic_lifecycle_impl.rs src/source_derivative_exercise_impl.rs src/source_distribution_lifecycle_impl.rs src/margin_option_index_source_impl.rs src/source_lifecycle_transition_witness_impl.rs src/source_proof_lifecycle_impl.rs src/source_proof_settlement_impl.rs src/source_procedural_bitvm_impl.rs src/source_liquidity_rewards_impl.rs src/source_tail_lifecycle_impl.rs src/source_lower_oracle_lifecycle_impl.rs src/source_lower_property_lifecycle_impl.rs src/source_main_callable_impl.rs src/source_main_production_impl.rs src/source_main_service_impl.rs src/source_main_snapshot_impl.rs src/source_main_startup_impl.rs src/source_main_file_io_impl.rs src/source_v8_sort_impl.rs src/source_lower_clearlist_impl.rs src/source_lower_send_commit_impl.rs src/source_lower_utxo_trade_impl.rs src/source_spot_lifecycle_impl.rs src/source_spot_matching_impl.rs src/source_spot_queue_fragments_impl.rs src/source_spot_schedule_impl.rs src/source_recent_lifecycle_transition_witness_impl.rs src/source_transfer_schedule_impl.rs src/source_token_channel_schedule_impl.rs src/source_withdrawal_schedule_impl.rs src/source_activation_lifecycle_impl.rs src/source_activation_hash_impl.rs src/source_amm_lifecycle_impl.rs src/source_amm_quote_impl.rs src/source_amm_remaining_impl.rs src/source_durable_replay_impl.rs src/source_durable_replay_tests.rs src/litecoin_transparent_impl.rs src/litecoin_mweb_structure_impl.rs src/source_full_dispatch_transition_witness_impl.rs src/source_durable_transition_witness_impl.rs src/source_durable_transition_witness_tests.rs
      - name: Check native Main integer parsing reference
        run: node scripts/check_main_production_parse_int.cjs
      - name: Check included native index and Main session formatting
        run: rustfmt --check --edition 2021 src/storage_read_snapshot_impl.rs src/source_compact_stream_impl.rs src/source_main_index_stream_impl.rs src/source_index_validity_stream_impl.rs src/compact_native_main_owner_access_impl.rs src/source_main_native_owner_access_impl.rs src/source_main_native_validity_impl.rs src/source_main_native_runtime_impl.rs src/source_main_native_catchup_impl.rs src/source_main_native_checkpoint_impl.rs
      - name: Lint
        run: cargo clippy --all-targets --frozen -- -D warnings
      - name: Install pinned test-only JavaScript references
        # Pin every direct external import used by the composed source oracle.
        # These are the executed reference versions, not the legacy JS lockfile.
        run: npm install --prefix "$RUNNER_TEMP/tl-secp-reference" --ignore-scripts --no-audit --no-fund --save-exact tiny-secp256k1@2.2.4 bitcore-lib-ltc@10.10.5 bitcore-lib@8.25.47 bitcoinjs-lib@6.1.8 bip32@5.0.1 nedb@1.8.0 big-json@3.2.0
      - name: Run tests
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: cargo test --frozen
      - name: Pinned Base94 and Base256 source compatibility vectors
        run: node scripts/legacy_base_vectors.cjs
      - name: Genuine BIP32 and complete source catalog owner vectors
        run: |
          node scripts/bip32_public_vectors.cjs --check --lib-root "$RUNNER_TEMP/tl-secp-reference"
          node scripts/clearlist_source_owner_vectors.cjs --check --module-root "$RUNNER_TEMP/tl-secp-reference"
          node scripts/property_catalog_vectors.cjs --check
          node scripts/oracle_source_owner_vectors.cjs --check --module-root "$RUNNER_TEMP/tl-secp-reference"
          node scripts/source_send_vectors.cjs --check
      - name: Bitcoin Core discovery bridge source tests
        run: python3 -m unittest discover -s tests -p test_bitcoin_core_rpc_stream.py -v
      - name: Genuine complete txIndex metadata lifecycle
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          node scripts/txindex_source_vectors.cjs --proof10 --check
          node scripts/txindex_source_vectors.cjs --check
          node scripts/txindex_source_vectors.cjs --lock --check
      - name: Original Main callable phase and journal evidence
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          node scripts/main_phase_vectors.cjs --proof10 --check
          node scripts/main_phase_vectors.cjs --proof10 --lock --check
          node scripts/main_phase_vectors.cjs --check
          node scripts/main_phase_vectors.cjs --lock --check
          node scripts/main_lower_vectors.cjs --proof10 --check
          node scripts/main_lower_vectors.cjs --proof10 --lock --check
          node scripts/main_lower_vectors.cjs --check
          node scripts/main_lower_vectors.cjs --lock --check
      - name: Native index streams and rich graph source evidence
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          for script in main_stream_controls validity_stream_controls native_main_controls native_processed_retry_prefix rich_thrown_vectors; do
            node "scripts/$script.cjs" --check
            node "scripts/$script.cjs" --lock --check
          done
          node scripts/source_graph_codec_vectors.cjs --check
          node scripts/rich_array_length_controls.cjs --check
      - name: Original spot and upper Main lifecycle evidence
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          for script in lower_spot_vectors main_spot_vectors; do
            for fixture in full proof10; do
              args=(--check)
              if [[ "$fixture" == proof10 ]]; then args+=(--proof10); fi
              node "scripts/$script.cjs" "${args[@]}"
              node "scripts/$script.cjs" "${args[@]}" --lock
              node "scripts/$script.cjs" "${args[@]}" --all-receivers
              node "scripts/$script.cjs" "${args[@]}" --all-receivers --lock
            done
          done
          node scripts/main_upper_vectors.cjs --proof10 --check
          node scripts/main_upper_vectors.cjs --proof10 --lock --check
          node scripts/main_upper_vectors.cjs --check
          node scripts/main_upper_vectors.cjs --lock --check
          node scripts/main_transfer_schedule_vectors.cjs --check
          node scripts/main_transfer_schedule_vectors.cjs --lock --check
          node scripts/main_transfer_continuations_vectors.cjs --check
          node scripts/main_transfer_continuations_vectors.cjs --lock --check
          node scripts/main_token_threshold_vectors.cjs --check
          node scripts/main_token_threshold_vectors.cjs --lock --check
          node scripts/main_withdrawal_schedule_vectors.cjs --check
          node scripts/main_withdrawal_schedule_vectors.cjs --lock --check
          node scripts/recent_lifecycle_witness_command_pins.cjs
      - name: Original activation bootstrap and Main0 evidence
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          node scripts/lower_activation_vectors.cjs --check
          node scripts/lower_activation_vectors.cjs --lock --check
          node scripts/lower_activation_vectors.cjs --proof10 --check
          node scripts/lower_activation_vectors.cjs --proof10 --lock --check
          node scripts/main_activation_vectors.cjs --check
          node scripts/main_activation_vectors.cjs --lock --check
          node scripts/main_activation_vectors.cjs --proof10 --check
          node scripts/main_activation_vectors.cjs --proof10 --lock --check
          node scripts/mixed_activation_vectors.cjs --check
          node scripts/mixed_activation_vectors.cjs --lock --check
          node scripts/v10_consensus_type_vectors.cjs --check
          node scripts/v10_consensus_type_vectors.cjs --lock --check
          node scripts/v10_insurance_find_vectors.cjs --check
          node scripts/v10_insurance_find_vectors.cjs --lock --check
      - name: Original AMM lifecycle, Main10 and remaining-method evidence
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          for script in lower_amm_vectors main_amm_vectors amm_quote_vectors amm_quote_number_vectors amm_remaining_vectors; do
            for fixture in full proof10; do
              args=(--check)
              if [[ "$fixture" == proof10 ]]; then args+=(--proof10); fi
              node "scripts/$script.cjs" "${args[@]}"
              node "scripts/$script.cjs" "${args[@]}" --lock
            done
          done
      - name: Shared orderBooks source and conditional witness inputs
        env:
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
        run: |
          node scripts/shared_orderbook_vectors.cjs --check
          node scripts/shared_orderbook_vectors.cjs --lock --check
          node scripts/main_mixed_vectors.cjs --check
          node scripts/main_mixed_vectors.cjs --lock --check
          node scripts/main_mixed_vectors.cjs --proof10 --check
          node scripts/main_mixed_vectors.cjs --proof10 --lock --check
          python3 scripts/source_full_dispatch_main_inputs.py --check
          node scripts/full_dispatch_witness_command_pins.cjs
      - name: Genuine composed source contract execution observations
        run: node scripts/source_contract_execution_vectors.cjs --check --module-root "$RUNNER_TEMP/tl-secp-reference"
      - name: Install exact source-lock numeric reference
        run: npm install --prefix "$RUNNER_TEMP/tl-bignumber-lock" --ignore-scripts --no-audit --no-fund --save-exact bignumber.js@9.1.2
      - name: Compare unchanged corpus with source-lock BigNumber
        env:
          TL_BIGNUMBER_LOCK_ROOT: ${{ runner.temp }}/tl-bignumber-lock
        run: |
          node --require ./scripts/bignumber_lock_reference.cjs scripts/source_contract_execution_vectors.cjs --check --module-root "$RUNNER_TEMP/tl-secp-reference"
          node --require ./scripts/bignumber_lock_reference.cjs scripts/source_send_vectors.cjs --check
          node --require ./scripts/bignumber_lock_reference.cjs scripts/oracle_source_owner_vectors.cjs --check --module-root "$RUNNER_TEMP/tl-secp-reference"
      - name: Literal contract runtime with exact source-lock BigNumber
        env:
          TL_TXINDEX_LOCKED_DEPENDENCY: "1"
          TL_SOURCE_BN_VERSION: "9.1.2"
          TRADELAYER_JS_ROOT: ${{ runner.temp }}/tl-secp-reference
          TL_BIGNUMBER_LOCK_ROOT: ${{ runner.temp }}/tl-bignumber-lock
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/bignumber_lock_reference.cjs
        run: cargo test --frozen --test contract_placement_source --test contract_settlement_source --test margin_map_source_owner --test source_contract_runtime --test source_contract_fees --test source_contract_oracle --test source_contract_adapters --test source_contract_clearing --test source_contract_replay --test source_contract_replay_versions --test source_contract_runtime_signatures --test margin_map_source_clearing --test source_clearing_funding --test source_insurance_lifecycle --test source_iou_settlement --test source_clearing_liquidation --test source_clearing_expiry --test source_clearing_global --test source_clearing_supply --test source_contract_registry_lifecycle --test source_contract_lifecycle_versions --test source_channel_financial --test source_channel_logic --test source_transition_witness --test source_option_trade --test source_synthetic_lifecycle --test source_option_lifecycle_versions --test source_derivative_exercise --test source_option_indexes --test source_option_adjustment_failures --test source_distribution_lifecycle --test source_txindex_owner --test source_proof_lifecycle --test source_proof_lifecycle_versions --test source_procedural_bitvm --test source_liquidity_rewards --test source_lifecycle_transition_witness --test source_tail_lifecycle --test source_lower_property_lifecycle --test source_lower_oracle_lifecycle --test source_lower_lifecycle_versions --test source_main_callable --test source_lower_clearlist --test source_lower_send_commit --test source_lower_utxo_trade --test source_main_callable_versions --test source_main_lower_callable --test source_lower_spot --test source_main_spot_callable --test source_spot_lifecycle_versions --test source_recent_lifecycle_transition_witness --test source_main_upper_callable --test source_main_transfer_schedule --test source_main_transfer_continuations --test source_main_token_threshold --test source_main_withdrawal_schedule --test source_activation_lifecycle --test source_activation_mixed_native --test source_activation_consensus_types --test source_activation_insurance_find --test source_main_activation_callable --test source_main_activation_inherited --test source_activation_lifecycle_versions --test source_amm_lifecycle_versions --test source_main_amm_inherited --test source_main_amm_activation_inherited --test source_lower_amm --test source_main_amm_callable --test source_amm_quotes --test source_amm_quote_number_hint --test source_amm_remaining --test source_shared_orderbook --test source_shared_orderbook_versions --test source_full_dispatch_transition_witness --test source_witness_projection_guard --test source_main_mixed_blocks --test source_main_production --test source_main_service --test source_main_error_labels --test source_main_review_boundaries --test source_main_review_errors --test source_main_review_service --test source_main_snapshots --test source_main_startup --test source_main_file_io --test source_main_file_sort
      - name: Official Litecoin structural codec fixtures
        run: |
          python3 scripts/extract_litecoin_official_examples.py --check
          python3 scripts/project_litecoin_core_goldens.py --check
      - name: Native public ECDSA independent and genuine reference vectors
        run: node scripts/secp256k1_vectors.cjs --check --tiny-root "$RUNNER_TEMP/tl-secp-reference"
      - name: Co-signed allocation transcripts and actual-owner signed fixtures
        run: |
          node scripts/channel_revision_vectors.cjs --check --tiny-root "$RUNNER_TEMP/tl-secp-reference"
          node scripts/channel_owner_vectors.cjs --check --tiny-root "$RUNNER_TEMP/tl-secp-reference"
