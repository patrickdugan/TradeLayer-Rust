          node scripts/validity_vectors.cjs --check
          node scripts/types_vectors.cjs --check
          node scripts/consensus_vectors.cjs --check
          node scripts/activation_vectors.cjs --check
          node scripts/native_genesis_vectors.cjs --check
          node scripts/native_entitlement_vectors.cjs --check
          node scripts/native_entitlement_owner_vectors.cjs --check
          node scripts/channels_vectors.cjs --check
          node scripts/oracle_vectors.cjs
          node scripts/amm_vectors.cjs
          node scripts/margin_map_vectors.cjs
