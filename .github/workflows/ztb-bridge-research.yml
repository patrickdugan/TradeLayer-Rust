name: ZTB bridge research (BRIDGE-SEC)

# Research-only fixtures under research/near-zk-bridge. Runs on research branch pushes
# so evidence exists before a PR is opened. No secrets, no network beyond tool installs.
on:
  push:
    branches: ["research/ztb-bridge-sec-**"]
    paths:
      - "research/near-zk-bridge/**"
      - ".github/workflows/ztb-bridge-research.yml"
  pull_request:
    paths:
      - "research/near-zk-bridge/**"
      - ".github/workflows/ztb-bridge-research.yml"
  workflow_dispatch:

concurrency:
  group: ztb-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: ZTB-01 accounting, ZTB-02 codec/vault, NEARPAY01 A/B, BRIDGE-SEC-01/02
        working-directory: research/near-zk-bridge
        run: |
          set -euo pipefail
          for t in test.mjs test_ztb02.mjs nearpay01/test.mjs nearpay01/test_b.mjs bridge-sec-01.mjs bridge-sec-02.mjs; do
            echo "::group::node $t"
            node "$t" | tee "/tmp/$(basename "$t").json"
            echo "::endgroup::"
          done
          checks=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/bridge-sec-02.mjs.json","utf8")).checks)')
          echo "::notice title=BRIDGE-SEC-02::${checks} checks passed; evidence matches bridge_sec_02_evidence.json"
      - name: Independent Python ABI and frontier oracles
        working-directory: research/near-zk-bridge
        run: |
          python3 ztb02_oracle.py
          python3 ztb02b_frontier.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/near-zk-bridge/mythos/lean
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          leanchecker-args: "BRIDGE_SECURITY"
          axiom-audit: true
          axiom-audit-root: "BRIDGE_SECURITY"
