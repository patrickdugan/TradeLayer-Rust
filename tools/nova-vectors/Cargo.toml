[package]
name = "nova-vectors"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nova-snark = "=0.76.0"
halo2curves = { version = "=0.9.0", features = ["std", "bits", "derive_serde", "asm"] }
ff = "0.13"
group = "0.13"
subtle = "2.6"
sha2 = "0.10"
sha3 = "0.10"
digest = "0.10"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
rand_chacha = "0.3"
rand_core = "0.6"
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
debug = false

[workspace]
